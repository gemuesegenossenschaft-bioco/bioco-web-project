name: Claude

# A writer can request @claude or assign the designated claude[bot] account.
# Authorization runs with a read-only token before any agent secret is exposed.
on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.request.outputs.authorized }}
    steps:
      - name: Authorize an explicit writer request
        id: request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.setOutput('authorized', 'false');
            const event = context.payload;
            const sender = event.sender;
            if (!sender || sender.type !== 'User') return;
            const assignment = context.eventName === 'issues' && event.action === 'assigned';
            if (assignment) {
              if (event.assignee?.login !== 'claude[bot]') return;
            } else {
              let request;
              if (['issue_comment', 'pull_request_review_comment'].includes(context.eventName)
                  && ['created', 'edited'].includes(event.action)) request = event.comment;
              if (context.eventName === 'pull_request_review' && event.action === 'submitted') request = event.review;
              if (context.eventName === 'issues' && event.action === 'opened') request = event.issue;
              if (!request || !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(request.author_association)) return;
              if (request.user?.type !== 'User') return;
              const text = context.eventName === 'issues' && event.action === 'opened'
                ? (request.title || '') + '\n' + (request.body || '') : (request.body || '');
              if (!/(^|\s)@claude(?=$|[\s.,:;!?])/i.test(text)) return;
              // A membership association alone does not establish repository write access.
              if (request.user.login !== sender.login) return;
            }
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: sender.login,
              });
              if (['write', 'maintain', 'admin'].includes(data.permission)) {
                core.setOutput('authorized', 'true');
              }
            } catch (error) {
              core.info('Could not establish repository write permission; request denied.');
            }

  claude:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          assignee_trigger: 'claude[bot]'
