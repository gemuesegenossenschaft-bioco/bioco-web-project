name: Promote WordPress production

on:
  workflow_dispatch:
    inputs:
      expected_baseline:
        description: Full currently accepted production commit SHA
        required: true
        type: string
      review_evidence:
        description: JSON with merged PR, CodeRabbit agreement, and accepted baseline
        required: true
        type: string
      containment_evidence:
        description: Optional private exact-document containment evidence, hash-bound in review evidence
        required: false
        type: string
        default: ''
      apply:
        description: Write owned code after a reviewed dry run
        required: true
        type: boolean
        default: false
      bootstrap_baseline:
        description: First promotion only; require exact owned-code baseline and reviewed evidence
        required: true
        type: boolean
        default: false

concurrency:
  group: wordpress-production-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  promote:
    if: github.ref == 'refs/heads/wordpress'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: dom
      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r .github/workflows/requirements-ci.txt
      - name: Install capture browser
        run: python3 -m playwright install --with-deps chromium
      - name: Install Apache routing test runtime
        run: sudo apt-get update && sudo apt-get install -y apache2
      - name: Configure separate SSH identities
        env:
          PRODUCTION_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PRODUCTION_KEY" && test -n "$PRODUCTION_HOSTS"
          test -n "$STAGING_KEY" && test -n "$STAGING_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_KEY" > "$HOME/.ssh/production"
          printf '%s\n' "$STAGING_KEY" > "$HOME/.ssh/staging"
          chmod 600 "$HOME/.ssh/production" "$HOME/.ssh/staging"
          printf '%s\n%s\n' "$PRODUCTION_HOSTS" "$STAGING_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/production" "$HOME/.ssh/staging"
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Create private review evidence
        env:
          EVIDENCE: ${{ inputs.review_evidence }}
          CONTAINMENT: ${{ inputs.containment_evidence }}
        run: |
          umask 077
          printf '%s' "$EVIDENCE" > "$RUNNER_TEMP/bioco-review-evidence.json"
          if [[ -n "$CONTAINMENT" ]]; then
            printf '%s' "$CONTAINMENT" > "$RUNNER_TEMP/bioco-containment-evidence.json"
          fi
      - name: Run fixed-profile promotion
        env:
          GH_TOKEN: ${{ github.token }}
          BIOCO_PROD_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          BIOCO_PROD_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          BIOCO_PROD_CONTENT: ${{ secrets.PRODUCTION_WP_CONTENT }}
          BIOCO_PROD_BACKUP_DIR: ${{ secrets.PRODUCTION_BACKUP_DIR }}
          BIOCO_PROD_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          BIOCO_STAGE_HOST: ${{ secrets.STAGING_SSH_HOST }}
          BIOCO_STAGE_USER: ${{ secrets.STAGING_SSH_USER }}
          BIOCO_STAGE_CONTENT: ${{ secrets.STAGING_WP_CONTENT }}
          BIOCO_STAGE_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          BASELINE: ${{ inputs.expected_baseline }}
          APPLY: ${{ inputs.apply }}
          BOOTSTRAP_BASELINE: ${{ inputs.bootstrap_baseline }}
        run: |
          args=(--commit="$GITHUB_SHA" --expected-baseline="$BASELINE" \
            --review-evidence="$RUNNER_TEMP/bioco-review-evidence.json")
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          if [[ "$BOOTSTRAP_BASELINE" == true ]]; then args+=(--bootstrap-baseline); fi
          if [[ -f "$RUNNER_TEMP/bioco-containment-evidence.json" ]]; then
            args+=(--containment-evidence="$RUNNER_TEMP/bioco-containment-evidence.json")
          fi
          wordpress/scripts/release-wordpress-production.py "${args[@]}"
      - name: Remove private review evidence
        if: always()
        run: rm -f "$RUNNER_TEMP/bioco-review-evidence.json" "$RUNNER_TEMP/bioco-containment-evidence.json"
