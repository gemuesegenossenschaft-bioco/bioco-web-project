name: Claude Task (manual)

# Fire-and-forget automation: start a one-off Claude task from the Actions
# tab with a free-text prompt (e.g. "run the frontend test suite and fix
# any failures", "summarize open issues and merged PRs"). Uses the
# same repo-scoped credentials as claude.yml. Requires ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for Claude (German or English)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  claude-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code task
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ inputs.prompt }}
