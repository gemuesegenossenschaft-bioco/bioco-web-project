name: Build verified WordPress package

on:
  push:
    branches: [wordpress]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-package-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/wordpress'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/requirements-ci.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: dom
          coverage: none
      - name: Install pinned validation dependencies
        run: python3 -m pip install --require-hashes -r .github/workflows/requirements-ci.txt
      - name: Install browser and routing runtimes
        run: |
          python3 -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y apache2
      - name: Validate and package this integration commit
        run: |
          python3 wordpress/scripts/release-wordpress-package.py build \
            --commit="$GITHUB_SHA" --output=output/releases/package
      - name: Publish the checked package and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordpress-package-${{ github.sha }}-${{ github.run_attempt }}
          path: output/releases/package/
          if-no-files-found: error
          retention-days: 30
      - name: Retain validation failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordpress-package-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: output/releases/preflight/
          if-no-files-found: warn
          retention-days: 14
