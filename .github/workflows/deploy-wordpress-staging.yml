name: Release WordPress staging

on:
  push:
    branches: [wordpress]
    paths:
      - wordpress/**
      - cms/content-seed/**
      - tests/**
      - .github/workflows/deploy-wordpress-staging.yml
      - .github/workflows/requirements-ci.txt
  workflow_dispatch:
    inputs:
      expected_baseline:
        description: Full accepted previous staging SHA
        required: true
        type: string
      package_run_id:
        description: Successful package workflow run for this exact integration SHA
        required: true
        type: string

concurrency:
  group: wordpress-staging-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.ref == 'refs/heads/wordpress'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: dom

      - name: Install test dependency
        run: python -m pip install --require-hashes -r .github/workflows/requirements-ci.txt

      - name: Install capture browser
        run: python -m playwright install --with-deps chromium

      - name: Install Apache routing test runtime
        run: sudo apt-get update && sudo apt-get install -y apache2

      # workflow_run only executes workflows registered on the default branch.
      # WordPress integrates on a different branch, so wait for its push package.
      - name: Resolve successful package run for this SHA
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.package_run_id }}
        run: |
          if [[ -n "$REQUESTED_RUN" ]]; then
            [[ "$REQUESTED_RUN" =~ ^[0-9]+$ ]]
            echo "run_id=$REQUESTED_RUN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            row=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build-wordpress-release.yml/runs" \
              -f branch=wordpress -f head_sha="$GITHUB_SHA" -f event=push \
              --jq '.workflow_runs | sort_by(.id) | reverse | .[0] | [.id, .status, .conclusion] | @tsv')
            read -r run_id status conclusion <<< "$row"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "Package run $run_id failed: $conclusion"; exit 1; }
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "No successful package run completed for $GITHUB_SHA"
          exit 1

      - name: Configure staging SSH key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          install -m 600 /dev/stdin "$HOME/.ssh/id_ed25519" <<< "$SSH_KEY"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run verified staging release
        env:
          BIOCO_WP_HOST: ${{ secrets.STAGING_SSH_HOST }}
          BIOCO_WP_USER: ${{ secrets.STAGING_SSH_USER }}
          BIOCO_WP_CONTENT: ${{ secrets.STAGING_WP_CONTENT }}
          BIOCO_WP_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          BIOCO_RELEASE_URL: https://staging.bioco.ch
          BIOCO_STAGING_CANDIDATE: ${{ github.sha }}
          BIOCO_STAGING_BASELINE: ${{ inputs.expected_baseline || vars.STAGING_ACCEPTED_BASELINE }}
          BIOCO_PACKAGE_RUN_ID: ${{ steps.package.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: wordpress/scripts/release-wordpress-staging.sh --commit="$BIOCO_STAGING_CANDIDATE" --expected-baseline="$BIOCO_STAGING_BASELINE" --package-run-id="$BIOCO_PACKAGE_RUN_ID" --apply

      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordpress-staging-release-${{ github.sha }}
          # Receipts contain private target compatibility and installed hashes.
          # Keep JSON evidence in the private workspace, outside public artifacts.
          path: output/releases/*.log
          if-no-files-found: warn
