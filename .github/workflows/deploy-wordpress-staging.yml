name: Release WordPress staging

on:
  push:
    branches: [wordpress]
    paths:
      - wordpress/**
      - cms/content-seed/**
      - tests/**
      - .github/workflows/deploy-wordpress-staging.yml
  workflow_dispatch:

concurrency:
  group: wordpress-staging-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"

      - name: Install test dependency
        run: python -m pip install --require-hashes -r .github/workflows/requirements-ci.txt

      - name: Configure staging SSH key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          install -m 600 /dev/stdin "$HOME/.ssh/id_ed25519" <<< "$SSH_KEY"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run verified staging release
        env:
          BIOCO_WP_HOST: ${{ secrets.STAGING_SSH_HOST }}
          BIOCO_WP_USER: ${{ secrets.STAGING_SSH_USER }}
          BIOCO_WP_CONTENT: ${{ secrets.STAGING_WP_CONTENT }}
          BIOCO_WP_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          BIOCO_RELEASE_URL: https://staging.bioco.ch
        run: wordpress/scripts/release-wordpress-staging.sh --commit="$GITHUB_SHA" --apply

      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordpress-staging-release-${{ github.sha }}
          path: output/releases/
          if-no-files-found: warn
