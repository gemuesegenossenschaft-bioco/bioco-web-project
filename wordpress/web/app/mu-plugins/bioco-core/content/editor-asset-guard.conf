# BEGIN bioco editor asset guard
Options -Indexes -MultiViews
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteOptions InheritDownBefore
RewriteCond %{REQUEST_URI} ^/wp-content/mu-plugins/bioco-core/assets/vendor/leaflet/(?:leaflet\.(?:css|js)|images/(?:layers(?:-2x)?|marker-icon(?:-2x)?|marker-shadow)\.png)$
RewriteRule ^ - [END]
RewriteCond %{REQUEST_URI} ^/wp-includes/js/dist/vendor/(?:lodash|moment|react|react-dom|react-jsx-runtime|react-jsx-runtime-19|regenerator-runtime|wp-polyfill|wp-polyfill-dom-rect|wp-polyfill-element-closest|wp-polyfill-fetch|wp-polyfill-formdata|wp-polyfill-inert|wp-polyfill-node-contains|wp-polyfill-object-fit|wp-polyfill-url)(?:\.min)?\.js$
RewriteRule ^ - [END]
RewriteCond %{REQUEST_URI} ^/wp-content/plugins/seo-by-rank-math/vendor/cmb2/cmb2/(?:css/cmb2\.min\.css|js/cmb2\.min\.js)$
RewriteRule ^ - [END]
RewriteCond %{REQUEST_URI} (^|/)\.(?!well-known(?:/|$)) [NC]
RewriteRule ^ - [F,END]
RewriteCond %{REQUEST_URI} (^|/)(?:wp-config(?:-sample)?\.php|wp-settings\.php|composer\.(?:json|lock)|package(?:-lock)?\.json)(?:$|[./~]) [NC]
RewriteRule ^ - [F,END]
RewriteCond %{REQUEST_URI} (^|/)(?:vendor|node_modules|private|backups?|cms-api)(?:/|$) [NC]
RewriteRule ^ - [F,END]
RewriteCond %{REQUEST_URI} (?:\.(?:sql(?:\.gz)?|bak|backup|old|orig|save|swp|log|ini|env|zip|tar(?:\.gz)?|tgz|7z)|~)$ [NC]
RewriteRule ^ - [F,END]
</IfModule>
# END bioco editor asset guard
